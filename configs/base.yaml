# ============================================================
#  Base configuration — shared defaults for all phases.
#  Phase-specific YAMLs override individual values.
# ============================================================

# --- Model registry (short names → HuggingFace IDs) ---
models:
  - llama3-8b
  - qwen2.5-7b
  - deepseek-coder-6.7b
  - codellama-7b

# --- Inference defaults (Thesis Table 5.1) ---
max_seq_length: 8192
max_new_tokens: 512
temperature: 0.0
top_p: 1.0
do_sample: false
seed: 42

# --- Quantization ---
quantization: "4bit"
compute_dtype: "bfloat16"
device_map: "auto"

# --- Dataset ---
dataset_source: "mivia"       # "local" = on-disk splits, "mivia" = private HF dataset
dataset_split: "test"
subset_fraction: 1.0
max_samples: 0
limit: 0

# --- Few-shot ---
few_shot_k: 3
few_shot_counts:
  - 1
  - 3

# --- Paths ---
output_dir: "results/runs"
models_dir: "models"
data_dir: "data"

# --- Resume / caching ---
resume: false
save_every_n: 10

# --- Storage ---
use_gcs: false
gcs_bucket: ""
gcs_prefix: ""

# --- Output control ---
save_predictions: true
save_raw_outputs: true

